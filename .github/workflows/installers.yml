name: Native installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'codex/**', 'tools/build_installers.py', 'tools/plugin_bundle_files.json', '.github/workflows/installers.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Canonical temporary directory
        shell: bash
        run: python -c "import os,pathlib; p=str(pathlib.Path(os.environ['RUNNER_TEMP']).resolve()); f=open(os.environ['GITHUB_ENV'],'a'); f.write('TMPDIR='+p+'\\nTMP='+p+'\\nTEMP='+p+'\\n')"
      - run: python -m pip install -r codex/companion/requirements.txt pillow==11.3.0 numpy==2.2.6 pytest==8.3.5
      - run: python -m unittest test_installer test_console test_console_setup test_console_windows
        working-directory: codex/companion
      - run: python -m pytest -q installer/test_bootstrap.py codex/tools/test_install_plugin.py tools/test_plugin_bundles.py
      - if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - run: python tools/build_installers.py --output dist --cache runtime-cache
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            dist/Snowball-Setup-*
            dist/build-*.json
          if-no-files-found: error
          retention-days: 14
