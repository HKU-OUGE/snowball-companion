name: Codex Windows and Linux
on:
  push:
    branches: [main]
    paths: ['codex/**', 'tools/**', '.github/workflows/codex-portable.yml']
  pull_request:
    paths: ['codex/**', 'tools/**', '.github/workflows/codex-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r codex/companion/requirements.txt pillow==11.3.0 numpy==2.2.6 pytest==8.3.5
      - run: python tools/check_codex_portable.py
